
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Explore project details, methodologies, technologies, and implementation highlights."
  >

  <title>Project Details | Nihad Mekhazni</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* PROJECT DETAIL PAGE */

    .project-page {
      min-height: 100vh;
      padding: 34px 0 70px;
    }

    .project-container {
      width: min(100% - 40px, 1000px);
      margin: 0 auto;
    }

    .project-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      color: #c7b4ed;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .project-back:hover {
      color: #f18bea;
    }

    .project-hero {
      position: relative;
      padding: 34px;
      border: 1px solid rgba(193, 96, 255, 0.42);
      border-radius: 18px;
      background:
        radial-gradient(
          circle at 90% 0%,
          rgba(132, 65, 220, 0.15),
          transparent 42%
        ),
        linear-gradient(
          115deg,
          rgba(23, 14, 43, 0.96),
          rgba(9, 8, 20, 0.96)
        );
      box-shadow: 0 0 35px rgba(147, 58, 255, 0.07);
      overflow: hidden;
    }

    .project-hero::before {
      content: "";
      position: absolute;
      left: 0;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background: linear-gradient(#bd74ff, #ff5bd8);
      box-shadow: 0 0 12px #ba5bff;
    }

    .project-eyebrow {
      margin-bottom: 13px;
      color: #e784f1;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .project-title {
      max-width: 800px;
      margin: 0 0 14px;
      color: #f5efff;
      font-size: clamp(27px, 5vw, 43px);
      line-height: 1.17;
      letter-spacing: -0.035em;
      overflow-wrap: anywhere;
    }

    .project-subtitle {
      margin: 0 0 22px;
      color: #b9a9d8;
      font-size: 13px;
    }

    .project-overview {
      max-width: 760px;
      color: #d2c8e5;
      font-size: 15px;
      line-height: 1.85;
    }

    .project-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    .project-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 10px 15px;
      border: 1px solid rgba(170, 119, 255, 0.4);
      border-radius: 9px;
      background: rgba(96, 67, 163, 0.14);
      color: #e8dcff;
      font-size: 12px;
      text-decoration: none;
      transition:
        transform 0.2s,
        border-color 0.2s,
        background 0.2s;
    }

    .project-action:hover {
      transform: translateY(-2px);
      border-color: rgba(235, 94, 224, 0.75);
      background: rgba(126, 69, 180, 0.2);
    }

    .project-action.primary {
      border-color: rgba(196, 111, 255, 0.65);
      background: linear-gradient(
        110deg,
        rgba(125, 68, 190, 0.28),
        rgba(188, 70, 171, 0.18)
      );
    }

    .project-section {
      margin-top: 22px;
      padding: 26px;
      border: 1px solid rgba(151, 103, 255, 0.24);
      border-radius: 15px;
      background: rgba(13, 10, 25, 0.68);
    }

    .project-section h2 {
      margin: 0 0 15px;
      color: #f0e7ff;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .project-section p {
      margin: 0;
      color: #c9bedb;
      font-size: 13px;
      line-height: 1.9;
    }

    .project-section + .project-section {
      margin-top: 16px;
    }

    .project-feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 5px;
    }

    .project-feature {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(151, 103, 255, 0.19);
      border-radius: 10px;
      background: rgba(96, 67, 163, 0.08);
      color: #d7cce9;
      font-size: 12px;
      line-height: 1.7;
    }

    .project-feature-mark {
      flex-shrink: 0;
      color: #dc85f4;
    }

    .project-method-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: method;
    }

    .project-method-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: #d7cce9;
      font-size: 13px;
      line-height: 1.7;
      counter-increment: method;
    }

    .project-method-list li::before {
      content: counter(method, decimal-leading-zero);
      flex-shrink: 0;
      color: #d68bff;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .project-tech-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .project-tech {
      padding: 7px 11px;
      border: 1px solid rgba(155, 117, 240, 0.28);
      border-radius: 99px;
      background: rgba(96, 67, 163, 0.16);
      color: #d7c8ff;
      font-size: 11px;
    }

        .project-tech-group + .project-tech-group {
      margin-top: 22px;
    }

    .project-tech-category {
      margin: 0 0 10px;
      color: #d68bff;
      font-size: 15px;
      font-weight: 600;
    }

    html[data-theme="light"] .project-tech-category {
      color: #965ac5;
    }

    .project-method-list li > div {
      flex: 1;
      min-width: 0;
    }

    .project-method-list li strong {
      color: #f0e7ff;
      font-weight: 600;
    }

    .project-method-list li p {
      margin-top: 4px;
    }

    html[data-theme="light"] .project-method-list li strong {
      color: #30203f;
    }

    .project-footer {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid rgba(151, 103, 255, 0.2);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .project-footer p {
      margin: 0;
      color: #998caf;
      font-size: 12px;
    }

    .project-state {
      padding: 45px 10px;
      color: #d2c8e5;
      text-align: center;
      line-height: 1.8;
    }

    .project-state h1 {
      color: #f5efff;
      font-size: 25px;
    }

    .project-state a {
      color: #e784f1;
    }

    @media (max-width: 620px) {
      .project-page {
        padding-top: 22px;
      }

      .project-container {
        width: calc(100% - 28px);
      }

      .project-back {
        margin-bottom: 22px;
      }

      .project-hero {
        padding: 25px 21px;
      }

      .project-section {
        padding: 21px 17px;
      }

      .project-feature-grid {
        grid-template-columns: 1fr;
      }

      .project-title {
        font-size: clamp(25px, 8vw, 35px);
      }

      .project-actions {
        align-items: stretch;
      }

      .project-action {
        flex: 1 1 auto;
      }

      .project-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .project-action,
      .project-back {
        transition: none;
      }
    }

  <main class="project-page">
    <div class="project-container">

      <a class="project-back" href="index.html#projects">
        <span aria-hidden="true">←</span>
        Back to portfolio
      </a>

      <div id="project-content" aria-live="polite">

      </div>


      <div id="project-lightbox" class="project-lightbox" hidden>
        <button type="button" class="project-lightbox-close" aria-label="Close media viewer">&times;</button>
        <div class="project-lightbox-content"></div>
      </div>


      <footer class="project-footer">
        <p>Designed and built by Nihad Mekhazni.</p>
        <a class="project-back" href="index.html#projects">
          Explore other projects ↗
        </a>

  <script>
  const savedTheme = localStorage.getItem("portfolio-theme");

  if (savedTheme === "light" || savedTheme === "dark") {
    document.documentElement.dataset.theme = savedTheme;
  }
</script>

  <script>
    (() => {
      const container = document.querySelector("#project-content");

      function makeElement(tag, className, text) {
        const element = document.createElement(tag);

        if (className) {
          element.className = className;
        }

        if (text !== undefined && text !== null) {
          element.textContent = text;
        }

        return element;
      }

      
      const isRenderable = (value) =>
        typeof value === "string" || typeof value === "number";

      function addSection(parent, title, content) {
        if (
          content === undefined ||
          content === null ||
          content === "" ||
          (Array.isArray(content) && content.length === 0)
        ) {
          return;
        }

        const section = makeElement("section", "project-section");
        section.appendChild(makeElement("h2", "", title));

        if (Array.isArray(content)) {
          const entries = content.filter(isRenderable);

          if (entries.length === 0) {
            console.warn(`Section "${title}" has no renderable text entries.`);
            return;
          }

          const list = makeElement("ul", "project-method-list");
          entries.forEach((entry) => {
            list.appendChild(makeElement("li", "", entry));
          });
          section.appendChild(list);
        } else if (isRenderable(content)) {
          section.appendChild(makeElement("p", "", content));
        } else {
          console.warn(`Section "${title}" has unsupported content; skipped.`);
          return;
        }

        parent.appendChild(section);
      }

            
      /* ---------- Dynamic section renderers ---------- */

      function startSection(parent, title) {
        const section = makeElement("section", "project-section");
        section.appendChild(makeElement("h2", "", title));
        parent.appendChild(section);
        return section;
      }

      const sectionRenderers = {
        text(parent, item) {
          addSection(parent, item.title, item.content);
        },

        features(parent, item) {
          if (!Array.isArray(item.content) || item.content.length === 0) return;

          const section = startSection(parent, item.title);
          const grid = makeElement("div", "project-feature-grid");

          item.content.forEach((feature) => {
            const card = makeElement("div", "project-feature");
            card.appendChild(makeElement("span", "project-feature-mark", "✦"));
            card.appendChild(makeElement("span", "", feature));
            grid.appendChild(card);
          });

          section.appendChild(grid);
        },

        steps(parent, item) {
          if (!Array.isArray(item.content) || item.content.length === 0) return;

          const section = startSection(parent, item.title);
          const list = makeElement("ul", "project-method-list");

          item.content.forEach((step) => {
            const li = makeElement("li", "");

            if (typeof step === "string") {
              li.textContent = step;
            } else if (step && typeof step === "object") {
              const wrapper = makeElement("div", "");
              wrapper.appendChild(makeElement("strong", "", step.title || ""));

              if (step.description) {
                wrapper.appendChild(makeElement("p", "", step.description));
              }

              li.appendChild(wrapper);
            }

            list.appendChild(li);
          });

          section.appendChild(list);
        },

        technologies(parent, item) {
          if (Array.isArray(item.categories)) {
            const categories = item.categories.filter(
              (category) =>
                category &&
                Array.isArray(category.items) &&
                category.items.length > 0
            );

            if (categories.length === 0) return;

            const section = startSection(parent, item.title);

            categories.forEach((category) => {
              const group = makeElement("div", "project-tech-group");
              group.appendChild(
                makeElement("h3", "project-tech-category", category.title || "")
              );

              const list = makeElement("div", "project-tech-list");

              category.items.forEach((technology) => {
                list.appendChild(makeElement("span", "project-tech", technology));
              });

              group.appendChild(list);
              section.appendChild(group);
            });

            return;
          }

          if (Array.isArray(item.content) && item.content.length > 0) {
            const section = startSection(parent, item.title);
            const list = makeElement("div", "project-tech-list");

            item.content.forEach((technology) => {
              list.appendChild(makeElement("span", "project-tech", technology));
            });

            section.appendChild(list);
          }
        }
      };

      function addDynamicSections(parent, sections) {
        if (!Array.isArray(sections)) return;

        sections.forEach((item) => {
          if (!item || typeof item !== "object" || !item.title) return;

          const renderer = sectionRenderers[item.type] || sectionRenderers.text;
          renderer(parent, item);
        });
      }


      function addFeatures(parent, features) {
        if (!Array.isArray(features) || features.length === 0) {
          return;
        }

        const section = makeElement("section", "project-section");
        section.appendChild(makeElement("h2", "", "Key Features"));

        const grid = makeElement("div", "project-feature-grid");

        features.forEach((feature) => {
          const item = makeElement("div", "project-feature");
          item.appendChild(
            makeElement("span", "project-feature-mark", "✦")
          );
          item.appendChild(makeElement("span", "", feature));
          grid.appendChild(item);
        });

        section.appendChild(grid);
        parent.appendChild(section);
      }

      function addTechnologies(parent, technologies) {
        if (!Array.isArray(technologies) || technologies.length === 0) {
          return;
        }

        const section = makeElement("section", "project-section");
        section.appendChild(makeElement("h2", "", "Technologies"));

        const list = makeElement("div", "project-tech-list");

        technologies.forEach((technology) => {
          list.appendChild(
            makeElement("span", "project-tech", technology)
          );
        });

        section.appendChild(list);
        parent.appendChild(section);
      }

      
function addGithubLink(hero, url) {
  if (typeof url !== "string" || !/^https?:\/\//i.test(url)) return;

  const link = makeElement("a", "project-github-link", "GitHub ↗");
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  hero.appendChild(link);
}

function openMediaViewer(item) {
  const overlay = document.querySelector("#project-lightbox");
  const content = overlay.querySelector(".project-lightbox-content");
  content.replaceChildren();

  const media = makeElement(item.type === "video" ? "video" : "img");

  if (item.type === "video") {
    media.controls = true;
    media.autoplay = true;
  } else {
    media.alt = item.description || "Project demonstration";
  }

  media.src = item.src;
  content.appendChild(media);
  overlay.hidden = false;
}

function addDemonstration(parent, mediaItems) {
  if (!Array.isArray(mediaItems)) return;

  const items = mediaItems.filter(item =>
    item &&
    ["image", "video"].includes(item.type) &&
    typeof item.src === "string" &&
    item.src.trim()
  );

  if (!items.length) return;

  const section = makeElement("section", "project-section");
  section.appendChild(makeElement("h2", "", "Demonstration"));

  const list = makeElement("div", "project-media-list");

  items.forEach(item => {
    const row = makeElement("div", "project-media-row");
    const thumb = makeElement("img", "project-media-thumb");

    thumb.src = item.src;
    thumb.alt = item.description || "Project demonstration";
    thumb.loading = "lazy";
    thumb.addEventListener("click", () => openMediaViewer(item));

    row.appendChild(thumb);
    row.appendChild(
      makeElement("div", "project-media-description",
        item.description || "Project demonstration")
    );
    list.appendChild(row);
  });

  section.appendChild(list);
  parent.appendChild(section);
}

function addDocuments(parent, documents) {
  if (!Array.isArray(documents)) return;

  const items = documents.filter(item =>
    item &&
    typeof item.url === "string" &&
    item.url.trim()
  );

  if (!items.length) return;

  const section = makeElement("section", "project-section");
  section.appendChild(
    makeElement("h2", "", "Documents & Publications")
  );

  const list = makeElement("div", "project-document-list");

  items.forEach(item => {
    const link = makeElement(
      "a",
      "project-document-link",
      `${item.title || "Document"} ↗`
    );
    link.href = item.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    list.appendChild(link);
  });

  section.appendChild(list);
  parent.appendChild(section);
}


      function renderProject(project) {
        const details = project.details || {};
        const card = project.card || {};
        const links = details.links || {};

        container.replaceChildren();

        const hero = makeElement("header", "project-hero");

        hero.appendChild(
          makeElement(
            "div",
            "project-eyebrow",
            project.category || "Project"
          )
        );

        hero.appendChild(
          makeElement("h1", "project-title", project.title || "Untitled Project")
        );

        hero.appendChild(
          makeElement(
            "p",
            "project-subtitle",
            details.subtitle || project.status || ""
          )
        );

        const overview = makeElement(
          "div",
          "project-overview",
          details.overview || card.description || ""
        );
        hero.appendChild(overview);

        const actions = makeElement("div", "project-actions");

        const backLink = makeElement(
          "a",
          "project-action primary",
          "← Back to portfolio"
        );
        backLink.href = "index.html#projects";
        actions.appendChild(backLink);

        hero.appendChild(actions);
addGithubLink(hero, links.github);

        container.appendChild(hero);

                        if (Array.isArray(details.sections)) {
          addDynamicSections(container, details.sections);
        } else {
          addSection(container, "The Problem", details.problem);
          addSection(container, "The Solution", details.solution);
          addFeatures(container, details.features);
          addSection(container, "Methodology", details.methodology);
          addTechnologies(container, details.technologies || card.technologies);
        }

        addDemonstration(container, details.media);
        addDocuments(container, details.documents);
      }

      async function init() {
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get("id");

        if (!projectId) {
          container.innerHTML =
            '<div class="project-state"><h1>No project selected</h1><p>Choose a project from the <a href="index.html#projects">portfolio</a>.</p></div>';
          return;
        }

        try {
          const response = await fetch("data/projects.json");

          if (!response.ok) {
            throw new Error("Could not load projects.json");
          }

          const data = await response.json();
          const projects = Array.isArray(data.projects) ? data.projects : [];
          const project = projects.find((item) => item.id === projectId);

          if (!project) {
            container.innerHTML =
              '<div class="project-state"><h1>Project not found</h1><p>This project ID does not exist. Return to the <a href="index.html#projects">portfolio</a> and choose another project.</p></div>';
            document.title = "Project Not Found | Nihad Mekhazni";
            return;
          }

          document.title = `${project.title} | Nihad Mekhazni`;
          renderProject(project);
        } catch (error) {
          console.error("Project page error:", error);

          container.innerHTML =
            '<div class="project-state"><h1>Unable to load project</h1><p>Make sure you are opening this page through Live Server and that <code>data/projects.json</code> is available.</p><p><a href="index.html#projects">Return to portfolio</a></p></div>';
        }
      }

      const lightbox = document.querySelector("#project-lightbox");

function closeMediaViewer() {
  const video = lightbox.querySelector("video");
  if (video) video.pause();

  lightbox.hidden = true;
  lightbox.querySelector(".project-lightbox-content").replaceChildren();
}

lightbox.querySelector(".project-lightbox-close").addEventListener(
  "click",
  closeMediaViewer
);

lightbox.addEventListener("click", event => {
  if (event.target === lightbox) closeMediaViewer();
});

      init();
    })();
  </script>
</body>
